name: Titan Invest
description: >-
  Titan (titan.com), operating the brand Titan Invest, is a wealth management
  firm founded in 2017 and headquartered in New York City that serves
  high-performing technology professionals. Titan combines AI-assisted
  technology with dedicated human wealth teams to deliver actively managed
  portfolios, direct indexing and equity-diversification strategies, tax
  planning, and financial advisory for pre- and post-IPO tech employees,
  charging a 0.4% annual advisory fee. The company reports managing roughly
  $1.2B in assets for more than 10,000 clients and is backed by General
  Catalyst. Titan delivers its service through consumer web and mobile
  applications and advisor relationships; it does not publish a public
  developer API, SDKs, or a developer portal, so this profile captures the
  company identity and domain-security posture rather than an API surface.
